group_names: [ "left_arm", "right_arm" ]
#group_names: ["panda_left", "panda_right"]

get_group_pose_service_id: [ "/get_group_pose", "/get_group_pose" ]

execute_group_cartesian_trajectory_service_id: [
  "/panda_left/execute_group_cartesian_trajectory",
  "/panda_right/execute_group_cartesian_trajectory"
]

# For each planning group, there is a set of joint names:
joint_names: [
  [ "panda_left_joint1", "panda_left_joint2", "panda_left_joint3", "panda_left_joint4", "panda_left_joint5",
    "panda_left_joint6", "panda_left_joint7" ],
  [ "panda_right_joint1", "panda_right_joint2", "panda_right_joint3", "panda_right_joint4", "panda_right_joint5",
    "panda_right_joint6", "panda_right_joint7" ],
]

# If true, will publish msgs to RViz for trajectory visualization
display_trajectory: true

# If set, the frame will be welded to the world frame and Toppra Optimization will be used
fixed_floating_frame: "summit_xls_base_footprint"
# The following will take effect if Toppra is activated.
velocity_discount_factor: 0.2
effort_discount_factor: 0.95